name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
      - run: npm run solver:prepare
      - run: npm run build
      - run: npm run test:ci
      - run: npm run test:inverse
      - run: npm run test:research
      - run: npm run test:mamo
      - run: npm run test:multifamily
      - run: npm run test:stress
      - run: npm run test:certification
      - run: node scripts/llm-grounding-test.mjs
      - run: python -B -m unittest discover -s tests -p test_decision_contract_protocol.py
      - run: node --test tests/decision-budget.test.mjs
